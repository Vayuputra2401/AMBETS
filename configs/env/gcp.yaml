# GCP training environment — Vertex AI / Cloud Storage
# Loaded when: python pipeline/train.py --env gcp

env: gcp

# GCP metadata (informational — printed at training start, not used by PyTorch code)
gcp:
  project:      "research-454007"
  bucket:       "research-brats"
  instance:     "ccr-research"
  zone:         "asia-east1-c"
  machine_type: "n1-standard-8"
  accelerator:  "nvidia-tesla-t4"

# Paths — data_root is LOCAL disk (copied from GCS once via gsutil -m cp).
# Reading training data from local SSD avoids gcsfuse API call charges (~5K INR/run).
# To copy: gsutil -m cp -r gs://research-brats/BraTS2024-BraTS-GLI-TrainingData/training_data1_v2 /home/g21cs2026/data/
# pretrained_path still reads from gcsfuse (one-time load at startup, negligible).
# checkpoint_dir is local; gcs_checkpoint_dir synced per checkpoint via gcloud storage cp.
paths:
  data_root:          "/home/g21cs2026/data/training_data1_v2"
  checkpoint_dir:      "/home/g21cs2026/checkpoints"
  pretrained_path:    "/gcs/research-brats/pretrained/model_swinvit.pt"
  gcs_checkpoint_dir: "gs://research-brats/checkpoints"
