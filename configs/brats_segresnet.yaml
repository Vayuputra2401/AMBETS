# CCR-SegResNet — the CNN instantiation of the CCR principle (second backbone, W1).
#
# Same CCR module / losses / curriculum / metrics as brats_phase2.yaml; only the backbone is a
# MONAI SegResNet (CNN) instead of Swin+UNETR. Select with:
#   python pipeline/train.py    --env gcp --model segresnet --config configs/brats_segresnet.yaml
#   python pipeline/evaluate.py --env gcp --model segresnet --config configs/brats_segresnet.yaml --checkpoint ...
#
# NOTE: the `swin` block below is reused only for in_channels (4) and drop_path_rate (SegResNet
# dropout); embed_dim=48 is kept solely to satisfy the Phase2Config stage invariant
# (ccr.router.embed_dim = 192 = 4*48). SegResNet has no SSL checkpoint, so pretrained_path="".

swin:
  img_size: [128, 128, 128]
  in_channels: 4
  embed_dim: 48
  window_size: [7, 7, 7]
  patch_size: [2, 2, 2]
  depths: [2, 2, 2, 2]
  num_heads: [3, 6, 12, 24]
  mlp_ratio: 4.0
  drop_path_rate: 0.0
  pretrained_path: ""
  use_checkpoint: true

data:
  data_root: ""
  brats_version: "2024"
  spatial_size: [128, 128, 128]
  val_fraction: 0.125
  test_fraction: 0.125
  num_workers: 6
  seed: 42

training:
  batch_size: 1
  grad_accum_steps: 4
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  grad_clip: 1.0
  amp: true
  checkpoint_dir: "checkpoints/"
  checkpoint_every: 5
  log_every: 10

ccr:
  router:
    embed_dim: 192          # = SegResNet bottleneck width (init_filters 24 * 2^3)
    num_concepts: 4
    use_prototypes: true
    temperature_learnable: true
  expert:
    embed_dim: 192
  curriculum:
    warmup_end_epoch: 10
    alignment_end_epoch: 60
    total_epochs: 80
    tau_warmup: 2.0
    tau_alignment: 1.0
    tau_refinement: 0.5
  loss:
    align_focal_gamma: 1.0
    align_concept_weights: [1.0, 3.0, 1.0, 1.0]
    contrastive_ncr_et_weight: 0.3
