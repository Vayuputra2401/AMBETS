# CCR-Net Phase 2 configuration
#
# All paths are relative to the repo root when running locally.
# On GCP, override via CLI:
#   python pipeline/train.py \
#     --data_root /gcs/bucket/brats \
#     --checkpoint_dir /gcs/bucket/checkpoints \
#     --pretrained_path /gcs/bucket/pretrained/model_swinvit.pt
#
# Or pass a separate GCP config YAML:
#   python pipeline/train.py --config /gcs/bucket/configs/gcp_phase2.yaml

swin:
  img_size: [128, 128, 128]
  in_channels: 4
  embed_dim: 48          # stage-2 output = 4*48 = 192 = ccr.router.embed_dim
  window_size: [7, 7, 7]
  patch_size: [2, 2, 2]
  depths: [2, 2, 2, 2]
  num_heads: [3, 6, 12, 24]
  mlp_ratio: 4.0
  drop_path_rate: 0.0
  pretrained_path: "pretrained/model_swinvit.pt"  # override with --pretrained_path on GCP
  use_checkpoint: true  # gradient checkpointing — required to fit on 16GB T4; disable on >=24GB GPUs for speed

data:
  data_root: ""           # REQUIRED — set via --data_root or fill in here
  brats_version: "2024"  # "2024" (t1c/t1n/t2w/t2f) or "2021" (t1ce/t1/t2/flair)
  spatial_size: [128, 128, 128]
  val_fraction: 0.125
  test_fraction: 0.125
  num_workers: 6  # of 8 vCPUs — leaves headroom for main process + CUDA driver
  seed: 42

training:
  batch_size: 1  # T4 (16GB) OOMs at batch_size=2 even with AMP; bump if running on >=24GB GPU
  grad_accum_steps: 4  # effective batch size = 1*4 = 4, compensates for batch_size=1 gradient noise
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  grad_clip: 1.0
  amp: true
  checkpoint_dir: "checkpoints/"  # override with --checkpoint_dir on GCP
  checkpoint_every: 5
  log_every: 10

# CCR Phase 1 config — do not change unless ablating
ccr:
  router:
    embed_dim: 192       # must equal 4 * swin.embed_dim
    num_concepts: 4
    use_prototypes: true
    temperature_learnable: true
  curriculum:
    warmup_end_epoch: 10
    alignment_end_epoch: 50
    total_epochs: 80
    tau_warmup: 2.0
    tau_alignment: 1.0
    tau_refinement: 0.5
