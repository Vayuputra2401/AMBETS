# CCR-Net Phase 2 configuration
#
# All paths are relative to the repo root when running locally.
# On GCP, override via CLI:
#   python pipeline/train.py \
#     --data_root /gcs/bucket/brats \
#     --checkpoint_dir /gcs/bucket/checkpoints \
#     --pretrained_path /gcs/bucket/pretrained/model_swinvit.pt
#
# Or pass a separate GCP config YAML:
#   python pipeline/train.py --config /gcs/bucket/configs/gcp_phase2.yaml

swin:
  img_size: [128, 128, 128]
  in_channels: 4
  embed_dim: 48          # stage-2 output = 4*48 = 192 = ccr.router.embed_dim
  window_size: [7, 7, 7]
  patch_size: [2, 2, 2]
  depths: [2, 2, 2, 2]
  num_heads: [3, 6, 12, 24]
  mlp_ratio: 4.0
  drop_path_rate: 0.0
  pretrained_path: "pretrained/model_swinvit.pt"  # override with --pretrained_path on GCP
  use_checkpoint: true  # gradient checkpointing — required to fit on 16GB T4; disable on >=24GB GPUs for speed

data:
  data_root: ""           # REQUIRED — set via --data_root or fill in here
  brats_version: "2024"  # "2024" (t1c/t1n/t2w/t2f) or "2021" (t1ce/t1/t2/flair)
  spatial_size: [128, 128, 128]
  val_fraction: 0.125
  test_fraction: 0.125
  num_workers: 6  # of 8 vCPUs — leaves headroom for main process + CUDA driver
  seed: 42

training:
  batch_size: 1  # T4 (16GB) OOMs at batch_size=2 even with AMP; bump if running on >=24GB GPU
  grad_accum_steps: 4  # effective batch size = 1*4 = 4, compensates for batch_size=1 gradient noise
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  grad_clip: 1.0
  amp: true
  checkpoint_dir: "checkpoints/"  # override with --checkpoint_dir on GCP
  checkpoint_every: 5
  log_every: 10

# CCR config — Run 4: stage-2 back, curriculum fixes from Run 3 kept
#
# Run history:
#   Run 1:  embed_dim=192, stage-2, align_end=50, lam_refine=0.5. NCR final=0.580
#   Run 2:  embed_dim=192, stage-2, align_end=50, lam_refine=0.5. NCR peak=0.706, final=0.698
#   Run 3:  embed_dim=96,  stage-1, align_end=60, lam_refine=1.0. NCR plateau=0.534 (stage-1 worse)
#   Run 4:  embed_dim=192, stage-2, align_end=60, lam_refine=1.0. Target: hold 0.706+ through refinement
#
# Why back to stage-2:
#   Stage-1 (96-dim, 32³) features caused over-routing to NCR expert (32% util vs true ~12%),
#   because lower-level features are ambiguous between NCR and ET. Stage-2 (192-dim, 16³) is
#   more semantically discriminative — NCR util was healthy at 17% in Run 2.
#
# What Run 4 fixes vs Run 2:
#   lam_align=1.0 in refinement (LossWeights.refinement in ccr_config.py — already set from Run 3)
#   alignment_end_epoch=60 (10 more epochs of alignment before refinement starts)
ccr:
  router:
    embed_dim: 192       # Run 4: stage-2 CCR = 4 * swin.embed_dim = 4*48 = 192
    num_concepts: 4
    use_prototypes: true
    temperature_learnable: true
  expert:
    embed_dim: 192       # must match router.embed_dim — explicit to avoid default=192 mismatch
  curriculum:
    warmup_end_epoch: 10
    alignment_end_epoch: 60  # Run 3: was 50 — extend alignment 10 epochs
    total_epochs: 80
    tau_warmup: 2.0
    tau_alignment: 1.0
    tau_refinement: 0.5
  loss:
    align_focal_gamma: 1.0                        # Run 2+: was 2.0 — gentler for rare NCR tokens
    align_concept_weights: [1.0, 3.0, 1.0, 1.0]  # Run 2+: NCR 3×, BG ignored (foreground_only=True)
    contrastive_ncr_et_weight: 0.3                # Run 2+: pairwise NCR-ET disambiguation loss
