# A1 Ablation — No L_align (lam_align = 0 throughout all phases)
#
# Purpose: prove that L_align is necessary for CCR routing to align with GT concepts.
# Hypothesis: without L_align, CAS_fg drops to ~0.10-0.25 (near-random routing),
#             while Dice remains similar (segmentation quality driven by L_seg + L_boundary).
#
# Only change vs brats_phase2.yaml:
#   ccr.loss.weights.alignment[0]  : 1.0 → 0.0
#   ccr.loss.weights.refinement[0] : 1.0 → 0.0
# (warmup already has lam_align=0.0 — no change needed)
#
# Usage:
#   python pipeline/train.py --env gcp --config configs/ablations/no_align.yaml

swin:
  img_size: [128, 128, 128]
  in_channels: 4
  embed_dim: 48
  window_size: [7, 7, 7]
  patch_size: [2, 2, 2]
  depths: [2, 2, 2, 2]
  num_heads: [3, 6, 12, 24]
  mlp_ratio: 4.0
  drop_path_rate: 0.0
  pretrained_path: "pretrained/model_swinvit.pt"
  use_checkpoint: true

data:
  data_root: ""
  brats_version: "2024"
  spatial_size: [128, 128, 128]
  val_fraction: 0.125
  test_fraction: 0.125
  num_workers: 6
  seed: 42

training:
  batch_size: 1
  grad_accum_steps: 4
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  grad_clip: 1.0
  amp: true
  checkpoint_dir: "checkpoints/"
  checkpoint_every: 2     # ablation: validate CAS/Dice/util every 2 ep to catch the early trend (stop ~ep25-30)
  log_every: 10

ccr:
  router:
    embed_dim: 192
    num_concepts: 4
    use_prototypes: true
    temperature_learnable: true
  expert:
    embed_dim: 192
  curriculum:
    warmup_end_epoch: 10
    alignment_end_epoch: 60
    total_epochs: 80
    tau_warmup: 2.0
    tau_alignment: 1.0
    tau_refinement: 0.5
  loss:
    align_focal_gamma: 1.0
    align_concept_weights: [1.0, 3.0, 1.0, 1.0]
    contrastive_ncr_et_weight: 0.0   # also disable contrastive (part of align loss family)
    weights:
      warmup:     [0.0, 0.5, 0.00, 0.0]   # unchanged (lam_align already 0 in warmup)
      alignment:  [0.0, 0.5, 0.01, 0.3]   # lam_align: 1.0 → 0.0
      refinement: [0.0, 0.1, 0.01, 1.0]   # lam_align: 1.0 → 0.0
